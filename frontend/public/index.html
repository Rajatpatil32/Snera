<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Primary SEO -->
    <title>SNERA — Premium Essentials</title>
    <meta name="description" content="Premium essentials crafted for those who believe the quietest statement is often the loudest. Shop SNERA — minimal, timeless fashion made in India." />
    <meta name="keywords" content="SNERA, premium fashion, minimal clothing, essentials, tshirts, Indian fashion, luxury basics" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://snera.in" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="SNERA — Premium Essentials" />
    <meta property="og:description" content="Premium essentials crafted for those who believe the quietest statement is often the loudest." />
    <meta property="og:image"       content="https://snera.in/og-image.jpg" />
    <meta property="og:url"         content="https://snera.in" />
    <meta property="og:site_name"   content="SNERA" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SNERA — Premium Essentials" />
    <meta name="twitter:description" content="Premium essentials crafted for those who believe the quietest statement is often the loudest." />
    <meta name="twitter:image"       content="https://snera.in/og-image.jpg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicons -->
    <link rel="icon"             href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest"         href="/manifest.json" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SNERA",
      "url": "https://snera.in",
      "logo": "https://snera.in/logo.png",
      "description": "Premium essentials crafted for those who believe the quietest statement is often the loudest.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "sameAs": ["https://instagram.com/sneraofficial"]
    }
    </script>

    <!-- Website structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SNERA",
      "url": "https://snera.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://snera.in/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run SNERA.</noscript>
    <div id="root"></div>
  </body>
</html>
